services:
    # default configuration for services in *this* file
    _defaults:
        # automatically injects dependencies in your services
        autowire: true
        # automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true
        # this means you cannot fetch services directly from the container via $container->get()
        # if you need to do this, you can override this setting on individual services
        public: false


    Weblizards\TagManagementBundle\EventListener\TagManagerListener:
        tags:
            - { name: kernel.event_subscriber }

    # controllers are imported separately to make sure they're public
    # and have a tag that allows actions to type-hint services
    Weblizards\TagManagementBundle\Controller\Admin\:
        resource: '../../Controller/Admin'
        public: true
        tags: ['controller.service_arguments']

    Weblizards\TagManagementBundle\Command\:
        resource: '../../Command'

#    Weblizards\TagManagementBundle\Tools\Installer:
#        public: true
#
#    Weblizards\TagManagementBundle\Config:
#        public: true

    # Services
    Weblizards\TagManagementBundle\Service\HtmlInsertionService: ~

    Weblizards\TagManagementBundle\Service\TagConfigDataBinder: ~

    Weblizards\TagManagementBundle\Service\TagExpiryService: ~

    Weblizards\TagManagementBundle\Service\TagInjectionService: ~
